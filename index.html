<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفقات</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1d2a2c;--mut:#6a7679;--line:#e6ebeb;--pri:#1d5bb5;--pri-d:#154690;--acc:#f28c1e;--card:#f6f8f8;--red:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121819;--fg:#e8eeee;--mut:#98a5a7;--line:#263032;--pri:#5b9bf0;--pri-d:#86b4f5;--card:#1a2224;--red:#e07a69}}
:root[data-theme="dark"]{--bg:#121819;--fg:#e8eeee;--mut:#98a5a7;--line:#263032;--pri:#5b9bf0;--pri-d:#86b4f5;--card:#1a2224;--red:#e07a69}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--fs)/1.7 var(--font)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.demo{background:var(--acc);color:var(--onacc);text-align:center;padding:6px 12px;font-size:14px}
header{display:flex;gap:12px;align-items:center;padding:14px 5%;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--hdr-bg);color:var(--hdr-fg);z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:26px;color:var(--logo-c);text-decoration:none}.lgi{height:var(--lh);width:auto;max-width:180px;object-fit:contain}.lgi.rd{border-radius:50%}
.search{flex:1;min-width:180px}
.search input{width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ib{background:none;border:1px solid color-mix(in srgb,currentColor 30%,transparent);border-radius:var(--br);padding:8px 14px;position:relative}
.ib b{background:var(--acc);color:var(--onacc);border-radius:99px;padding:0 7px;font-size:13px;margin-inline-start:6px}
.hero{padding:56px 5%;background:var(--hero-bg);color:var(--hero-fg)}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.25;margin:0 0 12px;max-width:16em}
.hero p{margin:0 0 20px;max-width:34em;opacity:.9}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:var(--br);padding:11px 22px;font-weight:500}
.btn:hover{background:var(--pri-d)}
.btn.w{background:var(--hero-fg);color:var(--hero-s)}
.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.perks{display:flex;gap:24px;flex-wrap:wrap;padding:18px 5%;border-bottom:1px solid var(--line);color:var(--mut);font-size:14px}
main{padding:28px 5% 48px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 16px}
.chip[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gmin),1fr));gap:20px}
.card{border:var(--cb);box-shadow:var(--sh);border-radius:var(--r);overflow:hidden;background:var(--cbg);display:flex;flex-direction:column}
.img{aspect-ratio:var(--ar);display:grid;place-items:center;font-size:64px;cursor:pointer;position:relative}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--red);color:#fff;font-size:13px;padding:0 10px;border-radius:99px}
.fav{position:absolute;top:8px;inset-inline-end:8px;background:var(--bg);border:0;border-radius:99px;width:34px;height:34px;font-size:18px}
.info{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-size:16px;font-weight:500;cursor:pointer}
.stars{color:var(--acc);font-size:14px}.stars span{color:var(--mut)}
.price{font-weight:700}.old{color:var(--mut);text-decoration:line-through;font-weight:400;font-size:14px;margin-inline-start:8px}
.info .btn{margin-top:auto}
.empty{text-align:center;color:var(--mut);padding:48px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
.ov.on{display:flex}
.drawer{background:var(--bg);width:min(440px,100%);height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal{background:var(--bg);margin:auto;width:min(720px,94%);max-height:92%;overflow:auto;border-radius:16px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:620px){.modal{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border:1px solid var(--line);background:none;border-radius:8px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.f.bad{border-color:var(--red)}.err{color:var(--red);font-size:13px;min-height:18px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:10px;z-index:40;display:none}
footer{text-align:center;padding:28px 5%;border-top:1px solid var(--line);background:var(--ftr-bg);color:var(--ftr-fg);font-size:14px}
.pg{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:30;display:none}.pg.on{display:block}
.admw{max-width:1000px;margin:0 auto;padding:24px 5%}.admh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.note{background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.login{max-width:360px;margin:12vh auto}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stats div{flex:1;min-width:110px;background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--mut)}.stats b{display:block;font-size:22px;color:var(--fg)}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:24px}.pf .full{grid-column:1/-1}
@media(max-width:620px){.pf{grid-template-columns:1fr}}
.pv{width:110px;height:110px;border-radius:12px;background:var(--card);display:grid;place-items:center;overflow:hidden;color:var(--mut);font-size:13px}
.tbw{overflow-x:auto}.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:8px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
.th{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--card);display:grid;place-items:center}
.btn.ig{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:var(--onpri);text-decoration:none;font-weight:700;padding:13px 22px}.btn.ig:hover{filter:brightness(1.08)}
:root{--font:"IBM Plex Sans Arabic",Tahoma,sans-serif;--fs:16px;--r:14px;--br:10px;--lh:44px;--gmin:210px;--ar:1;--sh:none;--cb:1px solid var(--line);--cbg:var(--bg);--onpri:#fff;--onacc:#10151f;--hdr-bg:var(--bg);--hdr-fg:var(--fg);--logo-c:var(--pri);--hero-bg:var(--pri);--hero-fg:#fff;--hero-s:var(--pri);--ftr-bg:var(--bg);--ftr-fg:var(--mut)}
.search input{color:var(--fg)}a:not(.btn):not(.logo){color:var(--pri)}
.thg{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}@media(max-width:760px){.thg{grid-template-columns:1fr}}
.thc{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-content:start}.thc .full{grid-column:1/-1}.thp{position:sticky;top:12px;align-self:start}
.prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);color:var(--fg);font:400 var(--fs)/1.7 var(--font)}
.prev header{position:static}.prev .hero{padding:22px 5%}.prev .hero h1{font-size:22px}.prev .hero p{font-size:14px}.prev main{padding:14px 5%}.prev footer{padding:14px 5%}
</style>
</head>
<body>
<header>
  <a class="logo" href="#" id="home" aria-label="صفقات – الصفحة الرئيسية"><img class="lgi" alt=""><span>صفقات</span></a>
  <div class="search"><input id="q" type="search" placeholder="ابحث عن منتج أو تصنيف…" aria-label="بحث"></div>
  <button class="ib" id="favBtn" aria-pressed="false">♥ المفضلة<b id="favN">0</b></button>
  <button class="ib" id="cartBtn">🛒 السلة<b id="cartN">0</b></button>
</header>
<section class="hero">
  <h1>كل اللي تحتاجه في مكان واحد! ⚡📱</h1>
  <p>اكتشف أحدث الإلكترونيات والإكسسوارات ومنتجات متنوعة تجمع بين الجودة والسعر المناسب، وتسوق بكل سهولة.</p>
  <button class="btn w" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">تسوّق الآن</button>
</section>
<div class="perks"><span>توصيل مجاني فوق 25 ر.ع.</span><span>اطلب بسهولة عبر إنستغرام</span><span>استبدال خلال 7 أيام</span></div>
<main id="shop">
  <div class="bar" id="cats" role="group" aria-label="التصنيفات"></div>
  <div class="bar">
    <select id="sort" aria-label="الترتيب">
      <option value="new">الأحدث</option><option value="best">الأكثر مبيعًا</option>
      <option value="lo">السعر: من الأقل</option><option value="hi">السعر: من الأعلى</option><option value="rate">الأعلى تقييمًا</option>
    </select>
    <label style="margin:0"><input type="checkbox" id="stock"> المتوفر فقط</label>
    <span id="count" style="color:var(--mut)"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer id="ft"><img class="lgi" id="fl" alt="" style="height:32px;margin-inline-end:10px;vertical-align:middle"><span style="font-weight:700;font-size:20px;vertical-align:middle;color:var(--logo-c);user-select:none">صفقات</span></footer>

<div class="ov" id="cartOv"><aside class="drawer" role="dialog" aria-label="السلة" id="cartBox"></aside></div>
<div class="ov" id="prodOv"><div class="modal" role="dialog" id="prodBox"></div></div>
<div class="pg" id="adm"><div class="admw" id="admBox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
let P=[
{id:1,n:"سماعات بلوتوث لاسلكية",c:"إلكترونيات",p:8.5,o:12,s:30,r:4.7,rc:41,e:"🎧",bg:"#e3ecfa",d:"صوت نقي وبطارية تدوم طويلًا مع ميكروفون مدمج.",b:110,t:8},
{id:2,n:"ساعة ذكية رياضية",c:"إلكترونيات",p:14,o:19,s:15,r:4.5,rc:23,e:"⌚",bg:"#e8eef7",d:"تتبع النشاط والنوم والإشعارات بشاشة واضحة.",b:80,t:7},
{id:3,n:"جهاز عرض صغير (بروجكتر)",c:"إلكترونيات",p:45,o:58,s:6,r:4.6,rc:12,e:"📽️",bg:"#dfe7f3",d:"شاهد أفلامك على شاشة كبيرة في أي غرفة.",b:35,t:6},
{id:4,n:"باور بانك 20000 mAh",c:"إكسسوارات",p:9,s:40,r:4.8,rc:36,e:"🔋",bg:"#fdebd3",d:"شحن سريع لجهازين في وقت واحد.",b:95,t:5},
{id:5,n:"شاحن سريع 65 واط",c:"إكسسوارات",p:6.5,s:0,r:4.4,rc:17,e:"🔌",bg:"#e6edf6",d:"يشحن الجوال واللابتوب بكفاءة وأمان.",b:60,t:4},
{id:6,n:"كفر حماية للجوال",c:"إكسسوارات",p:2.5,o:4,s:80,r:4.3,rc:29,e:"📱",bg:"#fbe3c6",d:"حماية من السقوط مع تصميم نحيف.",b:70,t:3},
{id:7,n:"مصباح مكتب LED",c:"منزل",p:7,s:22,r:4.6,rc:14,e:"💡",bg:"#fdf0cf",d:"إضاءة قابلة للتعديل تريح العين.",b:40,t:2},
{id:8,n:"غلاية كهربائية ذكية",c:"منزل",p:11,o:14,s:12,r:4.5,rc:18,e:"♨️",bg:"#e4ecf5",d:"تسخين سريع مع ضبط درجة الحرارة.",b:30,t:1}];
try{const sp=JSON.parse(localStorage.getItem("products")||"null");if(Array.isArray(sp))P=sp}catch(e){}
const COUPON={DEMO10:.1};const SHIP={"مسقط":1.5,"ظفار":3,"شمال الباطنة":2,"جنوب الشرقية":2.5,"أخرى":3.5};
const $=s=>document.querySelector(s);const f3=n=>n.toFixed(3)+" ر.ع.";
let cart={},favs=[],cat="الكل",term="",coupon=null,placing=false;
try{cart=JSON.parse(localStorage.getItem("cart")||"{}");favs=JSON.parse(localStorage.getItem("favs")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("cart",JSON.stringify(cart));localStorage.setItem("favs",JSON.stringify(favs))}catch(e){}};
const norm=s=>s.replace(/[\u064B-\u065F\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim().toLowerCase();
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2200)}
function stars(r,c){return `<div class="stars" aria-label="${r} من 5">${"★".repeat(Math.round(r))}${"☆".repeat(5-Math.round(r))} <span>(${c})</span></div>`}
let showFav=false;
function list(){let a=P.filter(x=>!x.h&&(cat==="الكل"||x.c===cat)&&(!showFav||favs.includes(x.id))&&(!$("#stock").checked||x.s>0)&&(!term||norm(x.n+" "+x.c+" "+x.d).includes(norm(term))));
const k=$("#sort").value;a.sort((x,y)=>k==="lo"?x.p-y.p:k==="hi"?y.p-x.p:k==="best"?y.b-x.b:k==="rate"?y.r-x.r:y.t-x.t);return a}
function render(){
clean();const cats=["الكل",...new Set(P.filter(x=>!x.h).map(x=>x.c))];
$("#cats").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
const a=list();$("#count").textContent=a.length+" منتج";
$("#grid").innerHTML=a.length?a.map(x=>`<article class="card"><div class="img" style="background:${x.bg}" data-o="${x.id}">${im(x)}${x.o?`<span class="tag">-${Math.round((1-x.p/x.o)*100)}%</span>`:x.b>=100?`<span class="tag" style="background:var(--pri)">الأكثر مبيعًا</span>`:""}<button class="fav" data-f="${x.id}" aria-label="مفضلة">${favs.includes(x.id)?"♥":"♡"}</button></div>
<div class="info"><h3 data-o="${x.id}">${x.n}</h3>${stars(x.r,x.rc)}<div><span class="price">${f3(x.p)}</span>${x.o?`<span class="old">${f3(x.o)}</span>`:""}</div>
<button class="btn" data-a="${x.id}" ${x.s?"":"disabled"}>${x.s?"أضف إلى السلة":"نفدت الكمية"}</button></div></article>`).join(""):`<div class="empty" style="grid-column:1/-1">لا توجد نتائج مطابقة. جرّب كلمة أخرى أو اختر تصنيف «الكل».</div>`;
$("#cartN").textContent=Object.values(cart).reduce((a,b)=>a+b,0);$("#favN").textContent=favs.length;
$("#favBtn").setAttribute("aria-pressed",showFav)}
function add(id,q=1){const p=P.find(x=>x.id==id);const n=(cart[id]||0)+q;if(n>p.s){toast("الكمية المطلوبة غير متوفرة. المتاح: "+p.s);return}cart[id]=n;save();render();toast("أُضيف إلى السلة ✓")}
function totals(){let sub=0;for(const id in cart){const p=P.find(x=>x.id==id);sub+=p.p*cart[id]}
const disc=coupon?sub*COUPON[coupon]:0;const city=($("#city")||{}).value||"مسقط";const ship=(sub-disc)>=25||!sub?0:SHIP[city];return{sub,disc,ship,tot:sub-disc+ship}}
function cartView(){const ids=Object.keys(cart);const t=totals();
$("#cartBox").innerHTML=`<div class="row" style="border:0"><h2 style="margin:0">السلة</h2><button class="btn o" data-x="cart">إغلاق</button></div>`+
(ids.length?ids.map(id=>{const p=P.find(x=>x.id==id);return `<div class="row"><div>${p.e} ${p.n}<br><small>${f3(p.p)}</small></div><div class="q"><button data-m="${id}" aria-label="تقليل">−</button><b>${cart[id]}</b><button data-pl="${id}" aria-label="زيادة">+</button></div></div>`}).join("")+
`<div class="row" style="border:0"><input class="f" id="cp" placeholder="كود الخصم (جرّب DEMO10)" value="${coupon||""}"><button class="btn o" id="cpb">تطبيق</button></div>
<div class="sum"><div><span>المجموع الفرعي</span><span>${f3(t.sub)}</span></div><div><span>الخصم</span><span>-${f3(t.disc)}</span></div><div><b>الإجمالي (بدون التوصيل)</b><b>${f3(t.sub-t.disc)}</b></div></div>
<button class="btn ig" id="goCk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg> اطلب عبر إنستغرام</button>`:`<div class="empty">السلة فارغة. أضف منتجًا لتبدأ.</div>`)}
function prod(id){const x=P.find(p=>p.id==id);let q=1;
const draw=()=>{$("#prodBox").innerHTML=`<div class="img" style="background:${x.bg};border-radius:12px;cursor:default;font-size:110px;overflow:hidden">${im(x)}</div>
<div><h2 style="margin-top:0">${x.n}</h2>${stars(x.r,x.rc)}<p><span class="price" style="font-size:22px">${f3(x.p)}</span>${x.o?`<span class="old">${f3(x.o)}</span>`:""}</p><p>${x.d}</p>
<p style="color:${x.s?(x.s<6?"var(--red)":"var(--pri)"):"var(--red)"}">${x.s?(x.s<6?"متبقي "+x.s+" فقط":"متوفر"):"نفدت الكمية"}</p>
<div class="q"><button id="qm">−</button><b>${q}</b><button id="qp">+</button></div><br>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="pa" ${x.s?"":"disabled"}>أضف إلى السلة</button><button class="btn o" id="pb" ${x.s?"":"disabled"}>اشترِ الآن</button><button class="btn o" data-x="prod">إغلاق</button></div>
<p style="color:var(--mut);font-size:14px">الاستبدال والإرجاع خلال 7 أيام. التوصيل خلال 2–4 أيام عمل.</p></div>`;
$("#qm").onclick=()=>{q=Math.max(1,q-1);draw()};$("#qp").onclick=()=>{q=Math.min(x.s||1,q+1);draw()};
$("#pa").onclick=()=>add(x.id,q);$("#pb").onclick=()=>{add(x.id,q);$("#prodOv").classList.remove("on");openCart(true)}};
draw();$("#prodOv").classList.add("on")}
function openCart(ck){$("#cartOv").classList.add("on");ck&&Object.keys(cart).length?igView():cartView()}
document.addEventListener("click",e=>{const t=e.target.closest("button,.img,h3");if(!t)return;const d=t.dataset;
if(d.c){cat=d.c;render()}else if(d.a)add(d.a);else if(d.o)prod(d.o);
else if(d.f){const i=+d.f;favs=favs.includes(i)?favs.filter(v=>v!==i):[...favs,i];save();render()}
else if(d.x){$(d.x==="cart"?"#cartOv":"#prodOv").classList.remove("on")}
else if(d.m){const i=d.m;if(--cart[i]<=0)delete cart[i];save();render();cartView()}
else if(d.pl){add(d.pl);cartView()}
else if(t.id==="cpb"){const c=$("#cp").value.trim().toUpperCase();if(!c){coupon=null}else if(COUPON[c]){coupon=c;toast("تم تطبيق الكوبون")}else toast("الكوبون غير صالح أو منتهي");cartView()}

function resize(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}

$("#admBox").innerHTML=`<div class="admh"><h2 style="margin:0">لوحة التحكم</h2><div style="display:flex;gap:8px"><button class="btn o" id="ex">عرض المتجر</button><button class="btn o" id="lo">تسجيل الخروج</button></div></div>
<div class="note">التعديلات تُحفظ في هذا المتصفح فقط ولن تظهر لزوار آخرين حتى يُربط المتجر بخادم وقاعدة بيانات.</div>
<div class="stats"><div><b>${P.length}</b>إجمالي المنتجات</div><div><b>${vis}</b>ظاهر في المتجر</div><div><b>${P.length-vis}</b>مخفي</div><div><b>${P.filter(x=>x.s<=0).length}</b>نفد مخزونه</div></div>
<div id="thm"></div>
<h3>إعدادات الطلب</h3><div class="pf"><div class="full"><label>رابط حساب إنستغرام</label><input class="f" id="igu" dir="ltr" value="${IG}"></div><div class="full" style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="sg">حفظ الرابط</button><button class="btn o" id="sgr">استعادة الرابط الافتراضي</button></div></div>
<h3>التصنيفات</h3><div class="pf"><div class="full" style="display:flex;gap:8px"><input class="f" id="cn2" placeholder="اسم تصنيف جديد"><button class="btn" id="cadd">إضافة تصنيف</button></div>
<div class="full tbw" style="margin-top:10px">${cs.length?`<table class="tb"><tr><th>التصنيف</th><th>عدد المنتجات</th><th></th></tr>${cs.map(c=>`<tr><td>${c}</td><td>${P.filter(x=>x.c===c).length}</td><td style="white-space:nowrap"><button class="btn o" data-cp="${c}">إضافة منتج فيه</button> <button class="btn o" data-cd="${c}" style="color:var(--red)">${delC===c?"تأكيد الحذف":"حذف"}</button></td></tr>`).join("")}</table>`:`<div class="empty">لا توجد تصنيفات. أضف أول تصنيف.</div>`}</div></div>
<h3 id="pfh">${editId?"تعديل المنتج":"إضافة منتج جديد"}</h3>
<div class="pf"><div><label>اسم المنتج</label><input class="f" id="an" value="${e.n||""}"></div>
<div><label>التصنيف</label><select class="f" id="ac">${cs.length?cs.map(c=>`<option value="${c}" ${(e.c||preC||cs[0])===c?"selected":""}>${c}</option>`).join(""):`<option value="عام">عام</option>`}</select></div>
<div><label>السعر (ر.ع.)</label><input class="f" id="ap" type="number" step="0.001" min="0" value="${e.p||""}"></div>
<div><label>السعر قبل الخصم (اختياري)</label><input class="f" id="ao" type="number" step="0.001" min="0" value="${e.o||""}"></div>
<div><label>الكمية في المخزون</label><input class="f" id="as" type="number" min="0" value="${e.s??""}"></div>
<div><label style="display:flex;gap:8px;align-items:center;margin-top:34px"><input type="checkbox" id="ah" ${e.h?"":"checked"}> ظاهر في المتجر</label></div>
<div class="full"><label>الوصف</label><textarea class="f" id="ad" rows="3">${e.d||""}</textarea></div>
<div class="full" style="display:flex;gap:14px;align-items:center;margin-top:10px"><div class="pv" id="pv"></div><div><input type="file" id="af" accept="image/*"><br><button class="btn o" id="ri" style="margin-top:8px">حذف الصورة</button></div></div>
<div class="full" style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="sv">${editId?"حفظ التعديلات":"إضافة المنتج"}</button>${editId?`<button class="btn o" id="cn">إلغاء</button>`:""}</div></div>
<h3>المنتجات</h3>${P.length?`<div class="tbw"><table class="tb"><tr><th></th><th>الاسم</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th></th></tr>${P.map(x=>`<tr><td><div class="th">${im(x)}</div></td><td>${x.n}</td><td>${f3(x.p)}</td><td>${x.s}</td><td>${x.h?"مخفي":"ظاهر"}</td><td style="white-space:nowrap"><button class="btn o" data-ed="${x.id}">تعديل</button> <button class="btn o" data-hd="${x.id}">${x.h?"إظهار":"إخفاء"}</button> <button class="btn o" data-dl="${x.id}" style="color:var(--red)">${delId===x.id?"تأكيد الحذف":"حذف"}</button></td></tr>`).join("")}</table></div>`:`<div class="empty">لا توجد منتجات. أضف أول منتج من النموذج أعلاه.</div>`}`;pvDraw();thmView()}
function saveProd(){const n=$("#an").value.trim(),p=parseFloat($("#ap").value),o=parseFloat($("#ao").value),s=parseInt($("#as").value,10);
if(n.length<2)return toast("أدخل اسم المنتج.");if(!(p>0))return toast("أدخل سعرًا صحيحًا أكبر من صفر.");
if(o&&o<=p)return toast("السعر قبل الخصم يجب أن يكون أكبر من السعر الحالي.");if(!(s>=0))return toast("أدخل كمية المخزون.");
const old=P.find(x=>x.id===editId);const d={n:esc(n),d:esc($("#ad").value.trim()),p,o:o>0?o:undefined,s,c:$("#ac").value||"عام",h:!$("#ah").checked};
if(pendImg!==undefined)d.img=pendImg||undefined;
const bk=JSON.stringify(P);
if(old)Object.assign(old,d);else P.unshift({id:Date.now(),r:0,rc:0,b:0,t:Date.now(),e:"📦",bg:"#e8eef7",...d});
if(!saveP()){P=JSON.parse(bk);return}
editId=null;pendImg=undefined;preC=null;render();admView();toast("تم الحفظ ✓")}
$("#adm").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset,id=t.id;
if(id==="lg")login();else if(id==="ex")hideAdm();else if(id==="sg")saveIg();else if(id==="sgr"){$("#igu").value=IG_DEF;saveIg()}else if(id==="lo"){admin=false;hideAdm()}
else if(id==="sv")saveProd();else if(id==="cn"){editId=null;pendImg=undefined;admView()}
else if(id==="ri"){pendImg=null;pvDraw()}
else if(d.ed){editId=+d.ed;pendImg=undefined;delId=null;admView();$("#adm").scrollTo({top:0,behavior:"smooth"})}
else if(d.hd){const x=P.find(v=>v.id==d.hd);x.h=!x.h;saveP();render();admView()}
else if(d.dl){const i=+d.dl;if(delId===i){P=P.filter(v=>v.id!==i);delId=null;if(editId===i)editId=null;saveP();render();toast("تم حذف المنتج")}else delId=i;admView()}});
$("#adm").addEventListener("change",async e=>{if(e.target.id!=="af")return;const f=e.target.files[0];if(!f)return;
if(!f.type.startsWith("image/")||f.size>8e6){toast("اختر صورة بصيغة صحيحة وأقل من 8 ميغابايت.");e.target.value="";return}
try{pendImg=await resize(f);pvDraw()}catch(x){toast("تعذر قراءة الصورة.")}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw")login();if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="a"){e.preventDefault();showAdm()}});
let fc=0,ft;$("#ft").addEventListener("click",()=>{fc++;clearTimeout(ft);ft=setTimeout(()=>fc=0,2500);if(fc>=5){fc=0;showAdm()}});
window.addEventListener("hashchange",()=>{location.hash==="#admin"?showAdm():$("#adm").classList.remove("on")});
if(location.hash==="#admin")showAdm();
applyStore();
render();
</script>
</body>
</html>
